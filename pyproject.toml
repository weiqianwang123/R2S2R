[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "r2s2r"
version = "0.1.0"
description = "Real-to-sim: a robot's scene from its own cameras, as an Isaac Lab scene."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
   "h5py",
   # MuJoCo stands in for the real world. 3.4+ needs websockets>=13, which
   # conflicts with the websockets==12.0 pin of isaacsim-kernel 5.1.
   "mujoco>=3.3,<3.4",
   "numpy",
   "opencv-python-headless",
   "PyYAML",
   "scipy",
   "trimesh",
]

[project.optional-dependencies]
develop = [
    "black",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2,<9",
    "types-PyYAML",
]

[project.scripts]
r2s2r = "r2s2r.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
r2s2r = ["py.typed", "pipeline/agentic/briefs/*.md", "viewer/static/*"]

[tool.pytest.ini_options]
# Only our tests: third_party/ and _isaaclab/ hold test files whose imports start
# Isaac Sim (and its licence prompt).
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "third_party"

[tool.isort]
py_version = 311
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "third_party/*", "_isaaclab/*"]
split_on_trailing_comma = true

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/", ".venv/", "third_party/", "_isaaclab/"]

[[tool.mypy.overrides]]
module = [
    "h5py.*",
    "scipy.*",
    "cv2.*",
    "trimesh.*",
    "isaaclab.*",
    "isaaclab_assets.*",
    "pxr.*",
    "omni.*",
    "carb",
    "torch.*",
    "mujoco.*",
]
ignore_missing_imports = true
